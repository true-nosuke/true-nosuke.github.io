name: Auto Generate Article

on:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間0:00に実行
  workflow_dispatch:      # 手動実行も許可

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install groq

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate Article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 scripts/generate_article.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "Add: AI生成記事の自動投稿 (${{ steps.date.outputs.date }})"
          branch: auto-article-${{ steps.date.outputs.date }}
          delete-branch: true
          title: "🤖 AI生成記事: ${{ steps.date.outputs.date }}"
          body: |
            ## 📝 AI生成記事
            
            **生成日時**: ${{ steps.date.outputs.date }}
            **モデル**: Groq Llama 3.3 70B Versatile
            
            ### ✅ レビューポイント
            - [ ] タイトルが適切か
            - [ ] 内容に誤りがないか
            - [ ] Markdown形式が正しいか
            - [ ] SEO最適化されているか
            
            ### 📂 変更ファイル
            - `_posts/${{ steps.date.outputs.date }}.md`
            
            ---
            *このプルリクエストは自動生成されました。内容を確認後、マージしてください。*
          labels: |
            auto-generated
            content