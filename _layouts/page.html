---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {% if page.meta == "noindex" %}
    <meta name="robots" content="noindex, nofollow">
    {% endif %}

  </header>
  <div class="post-content">
    {{ content }}
  </div>

</article>
